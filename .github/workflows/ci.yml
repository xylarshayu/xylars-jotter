name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The age interop tests fail instead of skipping when Go age is missing.
      REQUIRE_AGE_INTEROP: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install Go age (interop tests)
        run: go install filippo.io/age/cmd/...@v1.3.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm nx affected -t lint typecheck test build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jot/web exec playwright install --with-deps chromium
      # Builds the PWA and runs it against the local Worker (wrangler dev, no Cloudflare login).
      - run: pnpm --filter @jot/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
